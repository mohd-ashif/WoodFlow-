name: FurnitureOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-test-build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Typecheck Workspace
        run: npx tsc --noEmit

      - name: Run Backend Tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/test_db"
          JWT_SECRET: "test_jwt_secret_for_ci_pipeline_verification_123"
          JWT_REFRESH_SECRET: "test_jwt_refresh_secret_for_ci_pipeline_verification_123"
          NODE_ENV: "test"

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Build Backend API
        run: npm run build --workspace=apps/api

      - name: Build Web Frontend
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: "https://api.staging.furnitureos.com/api/v1"
